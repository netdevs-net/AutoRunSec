apiVersion: v1
kind: ConfigMap
metadata:
  name: falco-config
  namespace: ars
data:
  falco.yaml: |
    # File containing the rules for the Falco engine
    rules_files:
      - /etc/falco/falco_rules.yaml
    
    # Whether to output events in JSON or text
    json_output: true
    
    # Send events to this URL
    http_output:
      enabled: true
      url: "http://falco-sidekick:2801"
    
    # Log to standard error
    log_stderr: true
    
    # Log level (info, notice, warning, error, critical, alert, emergency, debug)
    log_level: info
    
    # Container runtime plugin configuration
    plugins:
      - name: container
        library_path: libcontainer.so
    
    # Disable syscall monitoring (since kernel module can't be loaded)
    syscall_event_drops:
      actions:
        - log
      rate: 0.03333
      max_burst: 15 
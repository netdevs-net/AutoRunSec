apiVersion: apps/v1
kind: Deployment
metadata:
  name: oceanhealing-dev
  namespace: ars
  labels:
    environment: development
    tier: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oceanhealing
      environment: development
      tier: development
  template:
    metadata:
      labels:
        app: oceanhealing
        environment: development
        tier: development
    spec:
      imagePullSecrets:
        - name: ghcr-creds-dev
      containers:
        - name: oceanhealing
          image: ghcr.io/webdevs-net/oceanhealing:latest
          ports:
            - containerPort: 5543
          readinessProbe:
            httpGet:
              path: /health
              port: 5543
            initialDelaySeconds: 10
            periodSeconds: 5
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.1.0
          args:
            - '-nginx.scrape-uri=http://localhost:5543/stub_status'
          ports:
            - containerPort: 9113
        - name: promtail
          image: grafana/promtail:2.8.0
          args:
            - '-config.file=/etc/promtail/promtail.yaml'
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
            - name: promtail-config
              mountPath: /etc/promtail/promtail.yaml
              subPath: promtail.yaml
        - name: otel-collector
          image: otel/opentelemetry-collector:0.96.0
          args:
            - '--config=/etc/otel-collector-config.yaml'
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel-collector-config.yaml
              subPath: otel-collector-config.yaml
      volumes:
        - name: logs
          emptyDir: {}
        - name: promtail-config
          configMap:
            name: promtail-sidecar-config
        - name: otel-config
          configMap:
            name: otel-config

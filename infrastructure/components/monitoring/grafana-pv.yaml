apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-pv
  labels:
    type: local
spec:
  storageClassName: hostpath
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/Users/s3/Sites/ARS/k8s-data/grafana"
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain 
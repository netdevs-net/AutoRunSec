groups:
  - name: application-alerts
    rules:
      # Request Rate (Throughput)
      - alert: LowRequestRate
        expr: sum(rate(http_requests_total{job="oceanhealing"}[5m])) < 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low request rate for OceanHealing"
          description: "Request rate is below 1 rps for more than 5 minutes."

      # Error Rate
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{job="oceanhealing",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="oceanhealing"}[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate for OceanHealing"
          description: "More than 5% of requests are errors (5xx) for 5 minutes."

      # Latency (Request Duration)
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="oceanhealing"}[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency for OceanHealing"
          description: "95th percentile latency is above 1s for 5 minutes."

      # CPU Usage
      - alert: HighCPUUsage
        expr: sum(rate(container_cpu_usage_seconds_total{namespace="ars", pod=~"oceanhealing.*"}[5m])) by (pod) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage in OceanHealing"
          description: "CPU usage is above 80% for 5 minutes."

      # Memory Usage
      - alert: HighMemoryUsage
        expr: sum(container_memory_usage_bytes{namespace="ars", pod=~"oceanhealing.*"}) by (pod) / sum(container_spec_memory_limit_bytes{namespace="ars", pod=~"oceanhealing.*"}) by (pod) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage in OceanHealing"
          description: "Memory usage is above 90% for 5 minutes."

  - name: infrastructure-alerts
    rules:
      # Node Availability
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: "Node {{ $labels.instance }} has been down for more than 1 minute."

      # Disk Space Monitoring
      - alert: DiskSpaceHigh
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space is running out on {{ $labels.instance }}"
          description: "Disk space is below 10% on {{ $labels.instance }}"

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}) * 100 < 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk space is critically low on {{ $labels.instance }}"
          description: "Disk space is below 5% on {{ $labels.instance }}"

      # Host CPU Usage
      - alert: HostHighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% on {{ $labels.instance }}"

      - alert: HostCriticalCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 90% on {{ $labels.instance }}"

      # Host Memory Usage
      - alert: HostHighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 80% on {{ $labels.instance }}"

      - alert: HostCriticalMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% on {{ $labels.instance }}"

      # Network Metrics
      - alert: HighNetworkErrors
        expr: rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High network errors on {{ $labels.instance }}"
          description: "Network error rate is high on {{ $labels.instance }}"

      - alert: HighNetworkDrops
        expr: rate(node_network_receive_drop_total[5m]) + rate(node_network_transmit_drop_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High network drops on {{ $labels.instance }}"
          description: "Network drop rate is high on {{ $labels.instance }}"

      - alert: HighNetworkUtilization
        expr: (rate(node_network_receive_bytes_total[5m]) + rate(node_network_transmit_bytes_total[5m])) / 1024 / 1024 > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High network utilization on {{ $labels.instance }}"
          description: "Network utilization is above 100 MB/s on {{ $labels.instance }}" 